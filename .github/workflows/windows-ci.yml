# Builds Sharp on every push and pull request. A change is checked by
# compiling it; Sharp runs no test suites (see CLAUDE.md), inherited or
# Ghostty's, whose upstream workflows need Ghostty's own runners anyway.
name: Windows build

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# Only the latest run per ref matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Caches the Zig compiler and fetched dependencies, keyed on
      # build.zig.zon.
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      # The GNU target is required: the default MSVC one fails in translate-c.
      # ReleaseSafe also catches the code that only compiles in safe modes.
      - name: Build
        run: zig build -Dapp-runtime=win32 -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe
